name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests, V3 smoke, and Cython MCTS build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch<2.5' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt pytest

      - name: Run focused V3 tests
        run: python -m pytest -q tests/test_gocube_katago_v3_cleanup.py tests/test_gocube_katago_v3_scoring.py tests/test_gocube_katago_v3_benson_topology.py

      - name: Run full pytest
        run: python -m pytest -q tests

      - name: Run Cube 4 and Torus 9 V3 validation smoke
        run: python -m alphazero.envs.gocube.v3_smoke --games 32

      - name: Print rules fingerprints and git status
        run: |
          python - <<'PY'
          from alphazero.envs.gocube.game import Cube4JapaneseGame, Torus9JapaneseGame
          print('Cube4 rules fingerprint:', Cube4JapaneseGame.rules_fingerprint())
          print('Torus9 rules fingerprint:', Torus9JapaneseGame.rules_fingerprint())
          PY
          git diff --stat origin/main...HEAD
          git status --short --branch

      - name: Build and import Cython MCTS
        run: |
          python - <<'PY'
          import alphazero.MCTS
          print('Cython MCTS import OK')
          PY
