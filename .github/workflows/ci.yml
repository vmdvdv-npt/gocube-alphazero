name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  golden:
    name: Golden production tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install current runtime test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch<2.5' 'numpy<2' pytest

      - name: Compile current production modules
        run: |
          python -m compileall -q \
            alphazero/envs/gocube/integration \
            gocube_golden \
            selfplay_engine.py \
            training_engine.py \
            tools/arena.py \
            tools/arena_engine.py \
            tools/arena_profiles

      - name: Run Golden regression suite
        run: python -m pytest -q -m "not katago_reference"

      - name: Verify current Golden entrypoints
        run: |
          python - <<'PY'
          from pathlib import Path

          from gocube_golden.cube_contract import CUBE_PROFILE_ID, load_profile
          from gocube_golden.torus9_contract import (
              TORUS9_CURRENT_PROFILE_ID,
              TORUS9_KOMI,
              load_torus9_current_profile,
          )
          from tools.arena_profiles import available_profiles

          assert CUBE_PROFILE_ID == 'gocube-cube4-golden-training-v1'
          assert load_profile()['rules']['komi'] == 0.5
          assert TORUS9_CURRENT_PROFILE_ID == 'gocube-torus9-golden-v3'
          assert load_torus9_current_profile()['rules']['komi'] == 0.5
          assert TORUS9_KOMI == 0.5
          assert available_profiles() == ('torus9',)
          assert not list(Path('.').rglob('*.pkl'))
          print('Golden production entrypoints verified')
          PY

  katago_reference:
    name: Mandatory pinned KataGo rule differential
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install differential test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy<2' pytest

      - name: Build pinned KataGo rule-only oracle
        run: tools/katago_reference/build_oracle.sh

      - name: Run pinned KataGo differential, bridge, and symmetry suites
        run: >-
          python -m pytest -q
          tests/reference/katago/test_gocube_katago_reference_random.py
          tests/reference/katago/test_gocube_katago_reference_rect.py
          tests/reference/test_gocube_topology_reference_bridge.py
          tests/reference/test_gocube_topology_symmetry_rules.py
