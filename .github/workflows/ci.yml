name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests, V3 smoke, hardened production smoke, and Cython MCTS build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch<2.5' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt pytest

      - name: Run focused V3 and hardened production tests
        run: |
          python -m pytest -q \
            tests/test_gocube_katago_v3_cleanup.py \
            tests/test_gocube_katago_v3_scoring.py \
            tests/test_gocube_katago_v3_benson_topology.py \
            tests/test_gocube_train_entrypoint.py \
            tests/test_gocube_training_budget_telemetry.py \
            tests/test_gocube_hardened_production.py

      - name: Run full pytest
        run: python -m pytest -q

      - name: Run Cube 4 and Torus 9 V3 validation smoke
        run: python -m alphazero.envs.gocube.v3_smoke --games 32

      - name: Run Cube 4 training accounting smoke
        run: |
          python -m alphazero.envs.gocube.train \
            --topology cube --size 4 --workers 1 --sims 1 --arena-sims 1 \
            --games-per-iteration 4 --iterations 1 --train-batch-size 256 \
            --endgame-sample-weight 1 --smoke --run-name ci-cube4-v3-budget-smoke \
            | tee /tmp/cube-training-smoke.log
          grep -Eq 'Games:[[:space:]]+4' /tmp/cube-training-smoke.log
          grep -Eq 'Regular decisions:[[:space:]]+[1-9][0-9]*' /tmp/cube-training-smoke.log
          grep -Eq 'Fast decisions:[[:space:]]+0' /tmp/cube-training-smoke.log
          grep -Eq 'Saved samples:[[:space:]]+[1-9][0-9]*' /tmp/cube-training-smoke.log
          grep -Eq 'Optimizer steps actual:[[:space:]]+[1-9][0-9]*' /tmp/cube-training-smoke.log
          grep -Eq 'Examples seen:[[:space:]]+[1-9][0-9]*' /tmp/cube-training-smoke.log
          python - <<'PY'
          import glob
          import torch
          files = sorted(glob.glob('data/ci-cube4-v3-budget-smoke/iteration-0001-*.pkl'))
          assert len(files) == 6, files
          rows = [int(torch.load(path).size(0)) for path in files]
          assert len(set(rows)) == 1 and rows[0] > 0, rows
          print('Cube 4 tensor rows:', rows[0])
          PY

      - name: Run Torus 9 training accounting smoke
        run: |
          python -m alphazero.envs.gocube.train \
            --topology torus --size 9 --workers 1 --sims 1 --arena-sims 1 \
            --games-per-iteration 4 --iterations 1 --train-batch-size 256 \
            --endgame-sample-weight 1 --smoke --run-name ci-torus9-v3-budget-smoke \
            | tee /tmp/torus-training-smoke.log
          grep -Eq 'Games:[[:space:]]+4' /tmp/torus-training-smoke.log
          grep -Eq 'Regular decisions:[[:space:]]+[1-9][0-9]*' /tmp/torus-training-smoke.log
          grep -Eq 'Fast decisions:[[:space:]]+0' /tmp/torus-training-smoke.log
          grep -Eq 'Saved samples:[[:space:]]+[1-9][0-9]*' /tmp/torus-training-smoke.log
          grep -Eq 'Optimizer steps actual:[[:space:]]+[1-9][0-9]*' /tmp/torus-training-smoke.log
          grep -Eq 'Examples seen:[[:space:]]+[1-9][0-9]*' /tmp/torus-training-smoke.log
          python - <<'PY'
          import glob
          import torch
          files = sorted(glob.glob('data/ci-torus9-v3-budget-smoke/iteration-0001-*.pkl'))
          assert len(files) == 6, files
          rows = [int(torch.load(path).size(0)) for path in files]
          assert len(set(rows)) == 1 and rows[0] > 0, rows
          print('Torus 9 tensor rows:', rows[0])
          PY

      - name: Run hardened Cube 4 production persistence smoke
        run: |
          RUN=ci-cube4-katago-hardened-smoke
          python -m alphazero.envs.gocube.hardened_train \
            --topology cube --size 4 --workers 1 --sims 1 --arena-sims 1 \
            --games-per-iteration 1 --iterations 1 --train-batch-size 64 \
            --fast-game-prob 0 --endgame-sample-weight 1 --no-arena --smoke \
            --run-name "$RUN" \
            | tee /tmp/hardened-training-smoke.log
          test -s "checkpoint/$RUN/iteration-0000.pkl"
          test -s "checkpoint/$RUN/iteration-0001.pkl"
          test -s "data/$RUN/iteration-0001-complete.json"
          python - <<'PY'
          import json
          import os
          import torch
          from alphazero.envs.gocube.atomic_io import RECOVERY_CONTRACT, REPLAY_TENSOR_SUFFIXES

          run = 'ci-cube4-katago-hardened-smoke'
          base = os.path.join('data', run, 'iteration-0001')
          with open(base + '-complete.json', encoding='utf-8') as handle:
              marker = json.load(handle)
          assert marker['recovery_contract'] == RECOVERY_CONTRACT, marker
          rows = []
          for suffix in REPLAY_TENSOR_SUFFIXES:
              path = base + suffix
              assert os.path.getsize(path) > 0, path
              rows.append(int(torch.load(path).size(0)))
          assert len(set(rows)) == 1 and rows[0] > 0, rows
          assert marker['row_count'] == rows[0], (marker, rows)
          checkpoint = torch.load(os.path.join('checkpoint', run, 'iteration-0001.pkl'), map_location='cpu')
          assert checkpoint['training_state']['training_contract'] == 'gocube-sample-clock-v2'
          assert checkpoint['args']['gocube_recovery_contract'] == RECOVERY_CONTRACT
          assert checkpoint['args']['gocube_komi'] == 0.5
          print('Hardened replay rows:', rows[0])
          PY

      - name: Print rules fingerprints and git status
        run: |
          python - <<'PY'
          from alphazero.envs.gocube.game import Cube4JapaneseGame, Torus9JapaneseGame
          print('Cube4 rules fingerprint:', Cube4JapaneseGame.rules_fingerprint())
          print('Torus9 rules fingerprint:', Torus9JapaneseGame.rules_fingerprint())
          PY
          git diff --stat origin/main...HEAD
          git status --short --branch

      - name: Build and import Cython MCTS
        run: |
          python - <<'PY'
          import alphazero.MCTS
          import alphazero.SelfPlayAgent
          print('Cython MCTS and SelfPlayAgent import OK')
          PY
