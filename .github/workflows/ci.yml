name: CI

on:
  push:
    branches:
      - main
  pull_request:
    paths-ignore:
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Core tests and GoCube smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch<2.5' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt pytest

      - name: Run full pytest
        run: python -m pytest -q

      - name: Run Cube 4 V3 smoke
        run: python -m alphazero.envs.gocube.v3_smoke --games 16 --topology cube --size 4

      - name: Run batched Cube 4 Arena smoke
        run: |
          python - <<'PY'
          from pathlib import Path
          from types import SimpleNamespace
          import torch

          from alphazero.NNetWrapper import NNetWrapper
          from alphazero.envs.gocube.train import build_training_args

          cli = SimpleNamespace(
              topology='cube', size=4, workers=1, sims=2, arena_sims=2,
              games_per_iteration=4, iterations=1, train_batch_size=256,
              train_steps_per_iteration=1, fast_game_prob=0.0,
              endgame_sample_weight=1, inference_batch_wait_ms=0.0,
              smoke=False, run_name='ci-arena-fixture', no_arena=True,
              model_gating=False,
          )
          game_cls, args = build_training_args(cli)
          folder = Path('/tmp/ci-arena-fixture')
          folder.mkdir(parents=True, exist_ok=True)

          torch.manual_seed(1)
          NNetWrapper(game_cls, args).save_checkpoint(str(folder), 'iteration-0000.pkl')
          torch.manual_seed(2)
          NNetWrapper(game_cls, args).save_checkpoint(str(folder), 'iteration-0001.pkl')
          PY

          python tools/evaluate_gocube_checkpoints.py \
            --candidate /tmp/ci-arena-fixture/iteration-0001.pkl \
            --reference /tmp/ci-arena-fixture/iteration-0000.pkl \
            --candidate-id ci-i1 --reference-id ci-i0 \
            --output /tmp/ci-batched-arena.json \
            --topology cube --size 4 --games 4 --sims 2 \
            --arena-batch-size 2 --arena-workers 1 --device cpu

          python - <<'PY'
          import json
          with open('/tmp/ci-batched-arena.json', encoding='utf-8') as handle:
              result = json.load(handle)
          assert result['batched'] is True, result
          assert result['balanced_colors'] is True, result
          assert result['candidate_black_games'] == 2, result
          assert result['candidate_white_games'] == 2, result
          assert result['games_effective'] + result['no_results'] == 4, result
          print('Batched Arena smoke:', result)
          PY

      - name: Build and import Cython MCTS
        run: |
          python - <<'PY'
          import alphazero.MCTS
          import alphazero.SelfPlayAgent
          print('Cython MCTS and SelfPlayAgent import OK')
          PY
